<!doctype html>
<meta charset="utf-8">
<title>bloppadd</title>
<style>
/* ============================================================
   SECTION 1: GLOBAL PALETTE
   All colors defined once here. Tweak values, not rules.
   ============================================================ */
:root {
	--usergreen:  #66cc33;   /* user text: editor + user turns in output */
	--servltgrey: #e8e8e8;   /* assistant answer text */
	--servdkgrey: #9090a0;   /* assistant reasoning text (grey, small) */
	--panebg:     #2a1a12;   /* output/editor surroundings */
	--setbg:      #12141c;   /* settings panel background */
	--setfg:      #9ca0c4;   /* settings panel text */
	--edge:       #4a5c66;   /* outlines around inputs/buttons */
}

/* ============================================================
   SECTION 2: PAGE FRAME
   Fixed-height, non-scrolling canvas. Sub-regions scroll instead;
   the browser scrollbar never appears.
   body is a flex COLUMN:  [ output ]  then  [ bottom ] pinned below.
   ============================================================ */
html, body {
	height: 100%;
	overflow: hidden;
	margin: 0;
}

body {
	font-size: 16px;
	display: flex;
	flex-direction: column;
	background: var(--panebg);
}

/* ============================================================
   SECTION 3: SERVER OUTPUT WINDOW (top region)
   Bounded flex item with its own scrollbar. Contains colored
   <span> elements: .user / .thought / .answer. Color alone marks
   the speaker and content type.
   ============================================================ */
#output {
	flex: 1;
	min-height: 0;
	font: 15px monospace;
	overflow-y: scroll;
	white-space: pre-wrap;
	word-wrap: break-word;
	background: var(--panebg);
	color: var(--servltgrey);
	outline: none;
	padding: 0.4em;
}

#output .user    { color: var(--usergreen); }
#output .thought { color: var(--servdkgrey); font-size: 12px; line-height: 1; display: block; }
#output .answer  { color: var(--servltgrey); }

/* ============================================================
   SECTION 4: TEXT-INPUT BOX (bottom-left region)
   #bottom is the fixed-height footer. #edwrap stretches flush with
   the settings column; the textarea fills #edwrap.
   ============================================================ */
#bottom {
	display: flex;
	flex: none;
	padding: 0.4em;
}

#edwrap {
	flex: 1;
	min-width: 0;
	display: flex;
	font: 16px monospace;
	overflow: hidden;
	white-space: pre-wrap;
	word-wrap: break-word;
}

#editor {
	background: #000000;
	color: var(--usergreen);
	outline: none;
	white-space: pre-wrap;
	word-wrap: break-word;
	overflow-y: auto;
	display: block;
	width: 100%;
	height: 100%;
	flex: 1;
	box-sizing: border-box;
	border: 0;
	resize: none;
	padding: 0.25em;
	font: 16px monospace;
}

/* ============================================================
   SECTION 5: SETTINGS BOX (bottom-right region)
   Narrow flex column: server, model, 2x2 numeric grid, buttons,
   status box (status line + live perf stats).
   ============================================================ */
#settings {
	width: 13%;
	background: var(--setbg);
	color: var(--setfg);
	display: flex;
	flex-direction: column;
	padding: 0.35em;
}
#settings input {
	width: 100%;
	box-sizing: border-box;
	background: var(--setbg);
	color: var(--setfg);
	border: 0;
	outline: 1px solid var(--edge);
	padding: 0 0.25em;
	margin: 0 0.25em 0 0;
	font: 13px monospace;
}

#settings label {
	display: block;
	padding: 0.15em;
}

#settings > label:nth-of-type(n+2),
#settings > #nums,
#settings > #controls,
#settings > #controls2 {
	margin-top: 0.3em;
}

#nums {
	display: grid;
	grid-template-columns: 1fr 1fr;
	gap: 0.15em;
	padding: 0.15em;
}

#nums label {
	display: block;
	padding: 0;
	margin: 0;
	font: 13px monospace;
}

#controls,
#controls2 {
	display: flex;
	justify-content: center;
}

#controls button,
#controls2 button {
	flex: none;
	margin: 0 0.15em;
}

#statusbox {
	margin-top: 0.3em;
	font: 13px monospace;
	color: var(--setfg);
	background: var(--setbg);
}

#status {
	display: block;
	text-align: center;
	padding: 0.15em;
	white-space: nowrap;
	overflow: hidden;
	text-overflow: clip;
}

.stat {
	display: block;
	padding: 0.1em 0.15em;
	white-space: nowrap;
	overflow: hidden;
	text-overflow: clip;
}

#statrow {
	display: flex;
}

#statrow .stat {
	flex: 1;
}

button {
	background: var(--setbg);
	color: var(--setfg);
	font: 13px monospace;
	border: 0;
	outline: 1px solid var(--edge);
	padding: 0 0.25em;
}

button:hover {
	outline: 3px solid var(--servltgrey);
}
</style>

<!-- ============================================================
     HTML LAYOUT
     [ #output                       ]  server output, own scrollbar
     [ #bottom: #edwrap | #settings ]  editor + settings, pinned bottom
     ============================================================ -->
<div id="output"></div>
<div id="bottom">
	<div id="edwrap">
		<textarea id="editor" spellcheck="false"> </textarea>
	</div>

	<div id="settings">
		<input id="server" type="text" value="127.0.0.1:9931">
		<input id="model" type="text" value="—">

		<div id="nums">
			<label>n_pred <input id="n_predict" type="text" value="-1"></label>
			<label>temp <input id="temp" type="text" value="1.0"></label>
			<label>top_p <input id="top_p" type="text" value="0.95"></label>
			<label>pen <input id="rp" type="text" value="1.0"></label>
		</div>

		<div id="controls">
			<button id="send">send</button>
			<button id="stopbtn">stop</button>
			<button id="newbtn">new</button>
		</div>
		<div id="controls2">
			<button id="btn4">undo</button>
			<button id="btn5">save</button>
			<button id="btn6">img</button>
		</div>

		<div id="statusbox">
			<div id="status">ready</div>
			<div id="statrow">
				<span class="stat" id="st_pp">pp:</span>
				<span class="stat" id="st_tg">tg:</span>
			</div>
			<span class="stat" id="st_ctx">¢</span>
		</div>
	</div>
</div>
<script>
"use strict";

/* ============================================================
   bloppadk: the OpenAI-compatible turn.

   WHAT DIED AND WHY:
     - buildPrompt() and the hardcoded Qwen wire format: the server
       now renders every family's chat template itself, from the
       Jinja template inside the GGUF.
     - The TH_OPEN/TH_CLOSE tag table and the thFeed/thPrint state
       machine: with --reasoning-format auto|deepseek the server
       strips reasoning blocks and returns them OUT OF BAND in
       delta.reasoning_content. Split-tag buffering is now a C++
       problem, solved once, for all clients.
     - modelStop harvesting from chat_template: the server knows its
       own EOS and turn-end strings. Stop tokens are its job.

   WHAT SURVIVED:
     - The shell, the palette, the guards, Ctrl+D, the AbortController,
       the perf stats with their retention rule, /props probing for
       name + n_ctx, and the slot-erase reset.
     - The philosophy: one file, no frameworks, no build step.

   SERVER SIDE, REQUIRED FOR GREY THOUGHTS:
     llama-server --reasoning-format auto   (or deepseek)
   With --reasoning-format none, reasoning arrives in-band inside
   delta.content and will render as part of the answer. Probe your
   build:  llama-server --help 2>&1 | grep reasoning-format

   CONTEXT-USED DISPLAY (¢):
     Anchored to server truth: lastServerPromptTokens from the
     previous turn's usage.prompt_tokens + chars/4 for new text.
     Live: ticks during streaming via updateCtxLive().
     Exact: snaps to usage.total_tokens on the final chunk.
     Purpose: warn the user when the context window is approaching.

   SLOT TRACKING:
     probeSlot() queries GET /slots, picks the first idle slot.
     slot_id is sent in the request body to pin the conversation.
     Erase calls target /slots/{id}?action=erase.

   LIVE TG:
     During streaming, updateCtxLive() computes a rolling
     tokens/sec over a 800 ms window. The final chunk's
     timings.predicted_per_second snaps to the server's number.

   UNDO:
     Removes the last complete round (user prompt + assistant reply
     + reasoning) from the DOM, the transcript, and the server KV
     (via slot erase). The user's prompt text is restored into the
     editor for editing and re-submission.
   ============================================================ */

/* ============================================================
   SECTION J1: GLOBAL STATE
   Declared exactly once. ctrl == null means idle.
   ============================================================ */
var editor, output, statusEl, server, model, send, stopbtn, newbtn;
var stPP, stTG, stCTX;
var nCtx = 0;
var ctrl = null;
var transcript = [];
var reply = "";
var thoughtSpan = null;
var answerSpan = null;
var thoughtTail = "";
var finishReason = "";
var promptEst = 0;
var thoughtChars = 0;

/* --- baseline re-normalization --- */
var lastServerPromptTokens = 0;   /* ground truth from last finished turn */

/* --- slot tracking --- */
var slotId = null;                /* pinned server slot, from /slots probe */

/* --- undo / cut --- */
var turnMarks = [];               /* indices into output.childNodes per turn */

/* --- live TG --- */
var tgLastTime = 0;               /* performance.now() of last TG sample */
var tgLastTokens = 0;             /* completion token estimate at last sample */

/* ============================================================
   SECTION J2: SMALL HELPERS
   ============================================================ */

/* The input box shows bare host:port; prepend scheme at fetch time. */
function serverURL() {
	var v = server.value.trim().replace(/\/+$/, "");
	if (v && v.indexOf("http://") !== 0 && v.indexOf("https://") !== 0)
		v = "http://" + v;
	return v;
}
function $(id) { return document.getElementById(id); }

function setStatus(msg) {
	statusEl.textContent = msg;
}

/* numeric input helper: NaN-safe, so temp "0" stays 0 */
function num(id, def) {
	var v = parseFloat($(id).value);
	return isNaN(v) ? def : v;
}

function scrollBottom() {
	output.scrollTop = output.scrollHeight;
}

/* append a colored span to the output log; returns the span */
function addSpan(cls, text) {
	var span = document.createElement("span");
	span.className = cls;
	span.textContent = text;
	output.appendChild(span);
	scrollBottom();
	return span;
}

/* ============================================================
   SECTION J2b: PERF STAT DISPLAY
   Two possible sources, whichever the server provides:
     o.timings (llama.cpp extension on the final chunk):
       prompt_per_second -> pp, predicted_per_second -> tg.
     o.usage (OpenAI standard, requires stream_options below):
       prompt_tokens, completion_tokens, total_tokens.
   RETENTION RULE: stats are never zeroed after a round. The last
   nonzero figures stay on screen between rounds.
   Live TG is handled in updateCtxLive(); the final chunk's
   timings.predicted_per_second overrides it with the exact number.
   ============================================================ */
function showStats(pp, tg) {
	if (typeof pp === "number" && pp > 0)
		stPP.textContent = "pp: " + Math.round(pp);
	if (typeof tg === "number" && tg > 0)
		stTG.textContent = "tg: " + Math.round(tg);
}

/* ============================================================
   SECTION J3: HISTORY AND ITS TRIMMING
   The transcript is a projection, not the screen: trimming it does
   not erase anything the user can see. Truncation invalidates the
   server's KV prefix from token 0, so it costs one full re-prefill
   ("the cliff"). Policy: pay the cliff RARELY and in BIG chunks —
   drop oldest messages until we sit at 60% of budget, not one turn
   per overflow. Token estimate is chars/4: crude, good enough to
   decide when to jump.

   Returns true if trimming occurred (baseline is now stale).
   ============================================================ */
function estTokens() {
	var c = 0;
	for (var i = 0; i < transcript.length; i++)
		c += transcript[i].content.length;
	return Math.ceil(c / 4);
}

function trimTranscript() {
	if (nCtx <= 0) return false;
	var budget = Math.floor(nCtx * 0.75);
	if (estTokens() <= budget) return false;
	var target = Math.floor(nCtx * 0.60);
	var trimmed = false;
	while (transcript.length > 2 && estTokens() > target) {
		transcript.shift();
		trimmed = true;
	}
	if (trimmed) {
		lastServerPromptTokens = 0;
		console.log("history trimmed to", transcript.length,
			"messages; baseline reset, next turn re-anchors");
	}
	return trimmed;
}

/* ============================================================
   SECTION J4: OUTPUT DISPLAY
   User turns: one green span. Assistant turns: grey thought span
   then bright answer span, created lazily and streamed into.
   Reasoning arrives tag-free from the server; we still tidy its
   whitespace: single linefeeds render, runs collapse to one.

   The ¢ context stat ticks live during streaming via updateCtxLive().
   Live TG is computed in the same pass.
   ============================================================ */
function logUser(text) {
	turnMarks.push(output.childNodes.length);
	addSpan("user", text + "\n");
}

function appendThought(t) {
	t = t.replace(/\n{2,}/g, "\n");
	if (thoughtTail === "\n" && t.charAt(0) === "\n")
		t = t.slice(1);
	if (t === "") return;
	thoughtTail = t.charAt(t.length - 1);
	thoughtChars += t.length;
	if (!thoughtSpan)
		thoughtSpan = addSpan("thought", "");
	thoughtSpan.textContent += t;
	scrollBottom();
	updateCtxLive();
}

function appendAnswer(t) {
	if (t === "") return;
	reply += t;
	if (!answerSpan)
		answerSpan = addSpan("answer", "");
	answerSpan.textContent += t;
	scrollBottom();
	updateCtxLive();
}

/* Live context-used estimate + live TG.
   Called on every streamed chunk.
   ¢: promptEst + completion chars/4.
   TG: rolling tokens/sec over 800 ms window.
   Snaps to exact usage.total_tokens on the final chunk (in the sink). */
function updateCtxLive() {
	if (nCtx <= 0) return;
	var completionEst = Math.ceil((reply.length + thoughtChars) / 4);
	var est = promptEst + completionEst;
	stCTX.textContent = "¢ " + est + "/" + nCtx;

	/* --- live TG --- */
	var now = performance.now();
	if (tgLastTime === 0) {
		tgLastTime = now;
		tgLastTokens = completionEst;
		return;
	}
	var dt = (now - tgLastTime) / 1000;
	if (dt >= 0.8) {
		var delta = completionEst - tgLastTokens;
		if (delta > 0) {
			var rate = delta / dt;
			stTG.textContent = "tg: " + Math.round(rate);
		}
		tgLastTime = now;
		tgLastTokens = completionEst;
	}
}

/* reset per-turn stream state at the start of a generate */
function beginReply() {
	reply = "";
	thoughtChars = 0;
	promptEst = 0;
	thoughtSpan = null;
	answerSpan = null;
	thoughtTail = "";
	finishReason = "";
	tgLastTime = 0;
	tgLastTokens = 0;
}

/* ============================================================
   SECTION J4c: UNDO / CUT — DOM REMOVAL
   Removes the last n turn-pairs from the output DOM.
   turnMarks holds the childNode index where each user span begins.
   ============================================================ */
function removeLastTurns(n) {
	while (n > 0 && turnMarks.length > 0) {
		var startIdx = turnMarks[turnMarks.length - 1];
		while (output.childNodes.length > startIdx)
			output.removeChild(output.lastChild);
		turnMarks.pop();
		n--;
	}
}

/* ============================================================
   SECTION J5: SSE FRAMING (OpenAI chat chunk format)
   Lines are "data: {json}", terminated by "data: [DONE]". Chunk
   shape: {choices:[{delta:{content, reasoning_content},
   finish_reason}]}; the final chunk (with stream_options below)
   carries {usage:{...}} and, on llama.cpp, may carry {timings}.
   The sink only frames; generate() interprets.
   ============================================================ */
function makeSseSink(onObj) {
	var buf = "";
	return function (chunk) {
		buf += chunk;
		var lines = buf.split(/\r\n|\r|\n/);
		buf = lines.pop();
		for (var i = 0; i < lines.length; i++) {
			var line = lines[i];
			if (line.lastIndexOf("data: ", 0) !== 0) continue;
			var payload = line.slice(6);
			if (payload === "[DONE]") continue;
			var obj;
			try { obj = JSON.parse(payload); } catch (e) { continue; }
			onObj(obj);
		}
	};
}

/* ============================================================
   SECTION J6: ACTIONS (stop / new / undo / save / img / keys)
   ============================================================ */
function stopGen() {
	if (!ctrl) return;
	ctrl.abort();
	setStatus("stopped");
	ctrl = null;
}

function editorKeydown(ev) {
	if ((ev.ctrlKey || ev.metaKey) && !ev.altKey && !ev.shiftKey
	 && (ev.key === "d" || ev.key === "D")) {
		ev.preventDefault();
		generate();
	}
}

function newSession() {
	if (ctrl) { setStatus("busy — stop first"); return; }
	var url = serverURL();
	if (!url) { setStatus("no server url"); return; }

	transcript = [];
	turnMarks = [];
	lastServerPromptTokens = 0;
	beginReply();
	editor.value = "";
	editor.focus();
	output.textContent = "";
	setStatus("clearing…");

	var eraseUrl = url + "/slots/" + (slotId !== null ? slotId : 0)
		+ "?action=erase";
	fetch(eraseUrl, { method: "POST" })
	.then(function (res) {
		if (!res.ok) throw new Error("HTTP " + res.status);
		setStatus("reset/ready" + (slotId !== null ? " · slot " + slotId : ""));
	})
	.catch(function (err) {
		setStatus("cleared");
	});
}

/* Undo the last complete round:
   1. Save the user prompt text (second-to-last transcript entry).
   2. Pop assistant (if present) and user from transcript.
   3. Remove the DOM nodes for that turn.
   4. Reset the token baseline.
   5. Erase the server slot so KV state matches the trimmed history.
   6. Restore the user text into the editor and focus it.
   ============================================================ */
function undoLast() {
	if (ctrl) { setStatus("busy — stop first"); return; }
	if (turnMarks.length === 0) { setStatus("nothing to undo"); return; }

	/* grab the user text before we pop it */
	var savedText = "";
	var i = transcript.length - 1;
	/* walk back to find the user message (may be last if no assistant
	   reply was recorded, e.g. aborted before any tokens) */
	while (i >= 0 && transcript[i].role === "assistant")
		i--;
	if (i >= 0 && transcript[i].role === "user")
		savedText = transcript[i].content;

	/* pop from transcript: assistant (if any), then user */
	if (transcript.length > 0
	 && transcript[transcript.length - 1].role === "assistant")
		transcript.pop();
	if (transcript.length > 0
	 && transcript[transcript.length - 1].role === "user")
		transcript.pop();

	/* strip the DOM */
	removeLastTurns(1);
	lastServerPromptTokens = 0;

	/* tell the server to forget */
	var url = serverURL();
	if (url && slotId !== null) {
		fetch(url + "/slots/" + slotId + "?action=erase",
			{ method: "POST" })
		.then(function () {})
		.catch(function () {});
	}

	/* restore the prompt into the editor */
	editor.value = savedText;
	editor.focus();
	/* place cursor at end of restored text */
	editor.selectionStart = editor.selectionEnd = savedText.length;

	setStatus("undone");
}

/* Placeholder: save transcript to file. Not yet implemented. */
function saveTranscript() {
	setStatus("save: not yet");
}

/* Placeholder: render output as image. Not yet implemented. */
function exportImage() {
	setStatus("img: not yet");
}

/* ============================================================
   SECTION J7: MODEL PROBING
   /props gives the display name (basename of model_path) and n_ctx
   for the ctx stat and the trim budget. chat_template_caps is logged
   for the curious. No tag harvesting remains: the server owns
   templates and stop strings now.

   After props succeed, probeSlot() discovers the server slot.
   ============================================================ */
function probeSlot(url) {
	return fetch(url + "/slots")
	.then(function (res) {
		if (!res.ok) throw new Error("HTTP " + res.status);
		return res.json();
	})
	.then(function (slots) {
		if (Array.isArray(slots) && slots.length > 0) {
			var idle = null;
			for (var i = 0; i < slots.length; i++) {
				if (slots[i].state === 0) { idle = slots[i]; break; }
			}
			slotId = (idle || slots[0]).id;
		} else {
			slotId = 0;
		}
	})
	.catch(function () {
		slotId = 0;
	});
}

function probeModel(url) {
	return fetch(url + "/props")
	.then(function (res) {
		if (!res.ok) throw new Error("server said " + res.status);
		return res.json();
	})
	.then(function (p) {
		var path = p.model_path || "";
		model.value = path.split("/").pop() || "(unknown model)";
		var dgs = p.default_generation_settings || {};
		nCtx = dgs.n_ctx || 0;
		lastServerPromptTokens = 0;
		turnMarks = [];
		console.log("chat_template_caps:",
			JSON.stringify(p.chat_template_caps || {}));
		stCTX.textContent = "¢ 0" + (nCtx > 0 ? "/" + nCtx : "");
		return probeSlot(url);
	})
	.then(function () {
		setStatus("ready" + (slotId !== null ? " · slot " + slotId : ""));
	})
	.catch(function (err) {
		nCtx = 0;
		model.value = "(no server)";
		setStatus("error: " + err.message);
	});
}

/* ============================================================
   SECTION J8: GENERATE
   Guards first, side effects second. One AbortController per
   generation; the stop button aborts it. The whole conversation
   goes out as a messages array; the server renders the template,
   streams delta.reasoning_content and delta.content separately,
   and stops itself at its own turn-end tokens.

   Context-used (¢) display:
     At turn start: promptEst anchored to lastServerPromptTokens
       (server truth) + chars/4 for the new user text. Falls back
       to estTokens() if the baseline is stale (trim, abort, new).
     During stream: updateCtxLive() ticks ¢ and TG on every chunk.
     On final chunk: snaps to exact usage.total_tokens; stores
       usage.prompt_tokens as the new baseline.
   ============================================================ */
function generate() {
	if (ctrl) { setStatus("busy"); return; }
	var userText = editor.value;
	if (userText.trim() === "") { setStatus("empty prompt"); return; }
	var url = serverURL();
	if (!url) { setStatus("no server url"); return; }

	logUser(userText);
	transcript.push({ role: "user", content: userText });
	editor.value = "";
	beginReply();

	var didTrim = trimTranscript();

	if (didTrim || lastServerPromptTokens === 0) {
		promptEst = estTokens();
	} else {
		promptEst = lastServerPromptTokens
			+ Math.ceil(userText.length / 4);
	}

	ctrl = new AbortController();
	setStatus("generating");

	var body = {
		messages: transcript,
		stream: true,
		stream_options: { include_usage: true },
		temperature: num("temp", 1.0),
		top_p: num("top_p", 0.95),
		repeat_penalty: num("rp", 1.0)
	};
	if (slotId !== null) body.slot_id = slotId;

	var np = parseInt($("n_predict").value, 10);
	if (np > 0) body.max_tokens = np;

	fetch(url + "/v1/chat/completions", {
		method: "POST",
		headers: { "Content-Type": "application/json" },
		signal: ctrl.signal,
		body: JSON.stringify(body)
	}).then(function (res) {
		if (!res.ok) throw new Error("server said " + res.status);
		return new Promise(function (resolve, reject) {
			var reader = res.body.getReader();
			var dec = new TextDecoder();
			var sink = makeSseSink(function (o) {
				var ch = o.choices && o.choices[0];
				if (ch && ch.delta) {
					if (typeof ch.delta.reasoning_content === "string")
						appendThought(ch.delta.reasoning_content);
					if (typeof ch.delta.content === "string")
						appendAnswer(ch.delta.content);
					if (ch.finish_reason)
						finishReason = ch.finish_reason;
				}
				if (o.timings)
					showStats(o.timings.prompt_per_second,
						o.timings.predicted_per_second);
				if (o.usage) {
					lastServerPromptTokens = o.usage.prompt_tokens;
					stCTX.textContent = "¢ " + o.usage.total_tokens
						+ (nCtx > 0 ? "/" + nCtx : "");
				}
			});
			(function pump() {
				reader.read().then(function (r) {
					if (r.done) { resolve(); return; }
					sink(dec.decode(r.value, { stream: true }));
					pump();
				}).catch(reject);
			})();
		});
	}).then(function () {
		if (reply !== "")
			transcript.push({ role: "assistant", content: reply });
		output.appendChild(document.createTextNode("\n"));
		scrollBottom();
		setStatus(finishReason === "length" ? "done (limit)" : "done");
	}).catch(function (err) {
		if (err.name === "AbortError") {
			if (reply !== "")
				transcript.push({ role: "assistant", content: reply });
			output.appendChild(document.createTextNode("\n"));
			scrollBottom();
			lastServerPromptTokens = 0;
			setStatus("stopped");
		} else {
			setStatus("error: " + err.message);
			console.error(err);
		}
	}).then(function () {
		ctrl = null;
	});
}

/* ============================================================
   SECTION J9: MAIN — element wiring; must be the LAST statement
   ============================================================ */
function main() {
	editor   = $("editor");
	output   = $("output");
	statusEl = $("status");
	server   = $("server");
	model    = $("model");
	send     = $("send");
	stopbtn  = $("stopbtn");
	newbtn   = $("newbtn");
	stPP     = $("st_pp");
	stTG     = $("st_tg");
	stCTX    = $("st_ctx");
	send.onclick    = generate;
	stopbtn.onclick = stopGen;
	newbtn.onclick  = newSession;
	$("btn4").onclick = undoLast;
	$("btn5").onclick = saveTranscript;
	$("btn6").onclick = exportImage;
	editor.addEventListener("keydown", editorKeydown);
	probeModel(serverURL());
	editor.focus();
	setStatus("ready");
}
main();
</script>
