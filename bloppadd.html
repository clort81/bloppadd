<!doctype html>
<meta charset="utf-8">
<title>bloppadn</title>
<style>
/* ============================================================
   SECTION 1: GLOBAL PALETTE
   All colors defined once here. Tweak values, not rules.
   ============================================================ */
:root {
	--usergreen:  #66cc33;
	--servltgrey: #e8e8e8;
	--servdkgrey: #9090a0;
	--panebg:     #2a1a12;
	--setbg:      #12141c;
	--setfg:      #9ca0c4;
	--edge:       #4a5c66;
	--trimwarn:   #ffcc00;
}

/* ============================================================
   SECTION 2: PAGE FRAME
   ============================================================ */
html, body {
	height: 100%;
	overflow: hidden;
	margin: 0;
}

body {
	font-size: 16px;
	display: flex;
	flex-direction: column;
	background: var(--panebg);
}

/* ============================================================
   SECTION 3: SERVER OUTPUT WINDOW
   ============================================================ */
#output {
	flex: 1;
	min-height: 0;
	font: 15px monospace;
	overflow-y: scroll;
	white-space: pre-wrap;
	word-wrap: break-word;
	background: var(--panebg);
	color: var(--servltgrey);
	outline: none;
	padding: 0.4em;
}

#output .user    { color: var(--usergreen); }
#output .thought { color: var(--servdkgrey); font-size: 12px; line-height: 1; display: block; }
#output .answer  { color: var(--servltgrey); }

/* ============================================================
   SECTION 4: TEXT-INPUT BOX
   ============================================================ */
#bottom {
	display: flex;
	flex: none;
	padding: 0.4em;
}

#edwrap {
	flex: 1;
	min-width: 0;
	display: flex;
	flex-direction: column;
	font: 16px monospace;
	overflow: hidden;
}

#imgstrip {
	display: none;
	align-items: center;
	gap: 0.4em;
	padding: 0.2em 0.3em;
	background: #111;
	border-bottom: 1px solid var(--edge);
	font: 12px monospace;
	color: var(--setfg);
}

#imgstrip img {
	max-height: 48px;
	max-width: 64px;
	object-fit: contain;
	border: 1px solid var(--edge);
}

#imgstrip .imgname {
	flex: 1;
	overflow: hidden;
	text-overflow: ellipsis;
	white-space: nowrap;
}

#imgstrip .imgclear {
	cursor: pointer;
	padding: 0 0.3em;
	border: 1px solid var(--edge);
	background: var(--setbg);
	color: var(--setfg);
	font: 12px monospace;
}

#imgstrip .imgclear:hover {
	border-color: var(--servltgrey);
}

#editor {
	background: #000000;
	color: var(--usergreen);
	outline: none;
	white-space: pre-wrap;
	word-wrap: break-word;
	overflow-y: auto;
	display: block;
	width: 100%;
	flex: 1;
	box-sizing: border-box;
	border: 0;
	resize: none;
	padding: 0.25em;
	font: 16px monospace;
}

/* ============================================================
   SECTION 5: SETTINGS BOX
   ============================================================ */
#settings {
	width: 13%;
	background: var(--setbg);
	color: var(--setfg);
	display: flex;
	flex-direction: column;
	padding: 0.35em;
}
#settings input {
	width: 100%;
	box-sizing: border-box;
	background: var(--setbg);
	color: var(--setfg);
	border: 0;
	outline: 1px solid var(--edge);
	padding: 0 0.25em;
	margin: 0 0.25em 0 0;
	font: 13px monospace;
}

#settings label {
	display: block;
	padding: 0.15em;
}

#settings > label:nth-of-type(n+2),
#settings > #nums,
#settings > #controls,
#settings > #controls2 {
	margin-top: 0.3em;
}

#nums {
	display: grid;
	grid-template-columns: 1fr 1fr;
	gap: 0.15em;
	padding: 0.15em;
}

#nums label {
	display: block;
	padding: 0;
	margin: 0;
	font: 13px monospace;
}

#controls,
#controls2 {
	display: flex;
	justify-content: center;
}

#controls button,
#controls2 button {
	flex: none;
	margin: 0 0.15em;
}

#statusbox {
	margin-top: 0.3em;
	font: 13px monospace;
	color: var(--setfg);
	background: var(--setbg);
}

#status {
	display: block;
	text-align: center;
	padding: 0.15em;
	white-space: nowrap;
	overflow: hidden;
	text-overflow: clip;
}

#trimwarn {
	color: var(--trimwarn);
	font-weight: bold;
}

.stat {
	display: block;
	padding: 0.1em 0.15em;
	white-space: nowrap;
	overflow: hidden;
	text-overflow: clip;
}

#statrow {
	display: flex;
}

#statrow .stat {
	flex: 1;
}

button {
	background: var(--setbg);
	color: var(--setfg);
	font: 13px monospace;
	border: 0;
	outline: 1px solid var(--edge);
	padding: 0 0.25em;
}

button:hover {
	outline: 3px solid var(--servltgrey);
}
</style>

<!-- ============================================================
     HTML LAYOUT
     ============================================================ -->
<div id="output"></div>
<div id="bottom">
	<div id="edwrap">
		<div id="imgstrip">
			<img id="imgthumb" src="" alt="">
			<span class="imgname" id="imgname"></span>
			<span class="imgclear" id="imgclear">✕</span>
		</div>
		<textarea id="editor" spellcheck="false"> </textarea>
	</div>

	<div id="settings">
		<input id="server" type="text" value="127.0.0.1:9931">
		<input id="model" type="text" value="—">

		<div id="nums">
			<label>n_pred <input id="n_predict" type="text" value="-1"></label>
			<label>temp <input id="temp" type="text" value="1.0"></label>
			<label>top_p <input id="top_p" type="text" value="0.95"></label>
			<label>pen <input id="rp" type="text" value="1.0"></label>
		</div>

		<div id="controls">
			<button id="send">send</button>
			<button id="stopbtn">stop</button>
			<button id="newbtn">new</button>
		</div>
		<div id="controls2">
			<button id="btn4">undo</button>
			<button id="btn5">save</button>
			<button id="btn6">upl</button>
		</div>

		<div id="statusbox">
			<div id="status"><span id="trimwarn"></span><span id="statustext">ready</span></div>
			<div id="statrow">
				<span class="stat" id="st_pp">pp:</span>
				<span class="stat" id="st_tg">tg:</span>
			</div>
			<span class="stat" id="st_ctx">¢</span>
		</div>
	</div>
</div>

<input type="file" id="imgfile"
       accept="image/*,text/*,.py,.rs,.go,.ts,.c,.cpp,.h,.hpp,.java,.rb,.sh,.json,.toml,.tex,.sql,.swift,.kt,.scala,.pl,.lua,.php,.m,.cs,.r,.jl,.zig,.ex,.erl,.dart,.groovy,.cmake,.make,.conf,.cfg,.env,.dockerfile"
       style="display:none">

<script>
"use strict";

/* ============================================================
   bloppadn: the OpenAI-compatible turn.

   WHAT DIED AND WHY:
     - buildPrompt() and the hardcoded Qwen wire format: the server
       now renders every family's chat template itself.
     - The TH_OPEN/TH_CLOSE tag table and the thFeed/thPrint state
       machine: with --reasoning-format auto|deepseek the server
       strips reasoning blocks and returns them OUT OF BAND.
     - modelStop harvesting from chat_template: the server knows its
       own EOS and turn-end strings.

   WHAT SURVIVED:
     - The shell, the palette, the guards, Ctrl+D, the AbortController,
       the perf stats with their retention rule, /props probing,
       and the slot-erase reset.
     - The philosophy: one file, no frameworks, no build step.

   SERVER SIDE, REQUIRED FOR GREY THOUGHTS:
     llama-server --reasoning-format auto   (or deepseek)

   PERF STATS (pp / tg):
     pp: computed from timings.prompt_n / timings.prompt_ms
         (final chunk only). Shows "pp: …" from request start.
     tg: DURING streaming — 800 ms rolling window (instantaneous).
         AT stream end — overridden with the MEAN for the whole
         round: completion_tokens / elapsed_gen_seconds.
         This matches the server log's "tg" column (cumulative avg).

   SAVE (btn5):
     Downloads the most recent assistant reply as a plain .txt
     file. Content is the raw answer text — no reasoning, no tags.

   FILE UPLOAD (btn6, "upl"):
     Clicking "upl" opens a file picker. Two paths:

     IMAGE (png, jpg, gif, webp, bmp, tiff, ico):
       Downscaled to 768 px max, encoded as a base64 data URL,
       stored in pendingImage. A thumbnail appears in #imgstrip
       above the editor. On the next generate(), the user message
       is sent as a multi-part content array (OpenAI vision
       format). The image is cleared after submission or on "new".
       Requires a vision-capable model. 15 MB limit.

     TEXT (code, markdown, config, logs, any text file):
       Read via FileReader.readAsText() and appended directly to
       the editor textarea, wrapped in ```filename fences. The
       user can append multiple files and type between them to
       build a long prompt. On send, the entire editor content
       (typed text + all appended files) is sent as a single
       string. No multi-part array. No vision API. The model
       reads the file contents as plain text in the prompt.
       2 MB limit.

     BINARY / UNKNOWN:
       If the file contains null bytes (0x00) in its content,
       it is rejected with a status message.

   TRIMMING AND THE ⓩ WARNING:
     When the estimated token count of the transcript (including
     the just-submitted prompt) exceeds 95% of nCtx, old messages
     are dropped from the front of the transcript until the
     estimate is below 60% of nCtx. The #output display is NOT
     modified — the user can still scroll up and read old
     messages. The model, however, no longer has them in its
     context.

     A bright yellow ⓩ (U+24E9) appears to the left of the
     status text whenever a trim has occurred. It persists until
     the user hits "new" (which clears the session and the
     warning). This alerts the user that early context has been
     lost and the model may have "forgotten" grounding information
     from the beginning of the conversation.
   ============================================================ */

/* ============================================================
   SECTION J1: GLOBAL STATE
   ============================================================ */
var editor, output, statusEl, server, model, send, stopbtn, newbtn;
var stPP, stTG, stCTX;
var statustext, trimwarn;
var nCtx = 0;
var ctrl = null;
var transcript = [];
var reply = "";
var thoughtSpan = null;
var answerSpan = null;
var thoughtTail = "";
var finishReason = "";
var promptEst = 0;
var thoughtChars = 0;

var lastServerPromptTokens = 0;
var slotId = 0;
var turnMarks = [];

var tgLastTime = 0;
var tgLastTokens = 0;

/* --- mean TG tracking --- */
var genStartTime = 0;
var completionTokens = 0;

/* --- file upload state (images only; text files go into the editor) --- */
var pendingImage = null;
var imgstrip, imgthumb, imgname, imgclear, imgfile;

/* --- rAF batching: accumulate text, flush once per frame --- */
var pendingThought = "";
var pendingAnswer  = "";
var rafPending     = false;
var flushTimer     = 0;
var answerTextNode = null;
var thoughtTextNode = null;

/* --- auto-scroll: only follow if user is near the bottom --- */
var autoScroll = true;

/* ============================================================
   SECTION J2: SMALL HELPERS
   ============================================================ */
function serverURL() {
	var v = server.value.trim().replace(/\/+$/, "");
	if (v && v.indexOf("http://") !== 0 && v.indexOf("https://") !== 0)
		v = "http://" + v;
	return v;
}
function $(id) { return document.getElementById(id); }

function setStatus(msg) {
	statustext.textContent = msg;
}

function num(id, def) {
	var v = parseFloat($(id).value);
	return isNaN(v) ? def : v;
}

function scrollBottom() {
	output.scrollTop = output.scrollHeight;
}

function addSpan(cls, text) {
	var span = document.createElement("span");
	span.className = cls;
	span.textContent = text;
	output.appendChild(span);
	return span;
}

/* ============================================================
   SECTION J2b: PERF STAT DISPLAY
   ============================================================ */
function showStats(pp, tg) {
	if (typeof pp === "number" && pp > 0)
		stPP.textContent = "pp:" + Math.round(pp);
	if (typeof tg === "number" && tg > 0)
		stTG.textContent = "tg:" + Math.round(tg);
}

/* Compute and display the mean TG for the completed round.
   Called at stream end (both success and abort paths). */
function showMeanTg() {
	if (genStartTime === 0) return;
	var elapsed = (performance.now() - genStartTime) / 1000;
	if (elapsed <= 0) return;
	var tokens;
	if (completionTokens > 0) {
		tokens = completionTokens;
	} else {
		tokens = Math.ceil((reply.length + thoughtChars) / 4);
	}
	if (tokens <= 0) return;
	var avg = tokens / elapsed;
	stTG.textContent = "tg:" + Math.round(avg);
}

/* ============================================================
   SECTION J3: HISTORY AND ITS TRIMMING

   BUDGET: 95% of nCtx. If the estimated token count of the
   transcript (including the just-submitted user prompt) exceeds
   this, trimming is triggered.

   TARGET: 60% of nCtx. Old messages are dropped from the front
   of the transcript until the estimate is below this.

   RATIONALE: The 95% threshold was chosen (up from the original
   75%) because the user needs maximum context available for
   long multi-file prompts. Trimming at 75% was too aggressive
   and caused the model to lose early grounding information
   before the user realized it. The 60% target ensures a
   substantial re-prefill margin so the next turn is not
   immediately at the edge again.

   The trim is computed AFTER the new user prompt has been
   pushed onto the transcript, so a long prompt can trigger a
   trim while a short one will not.

   VISUAL WARNING: When a trim occurs, a bright yellow ⓩ
   (U+24E9) is displayed to the left of the status text. It
   persists until "new" is pressed.
   ============================================================ */
function contentChars(msg) {
	if (typeof msg.content === "string") return msg.content.length;
	var c = 0;
	for (var i = 0; i < msg.content.length; i++) {
		if (msg.content[i].type === "text")
			c += msg.content[i].text.length;
		else
			c += 4000;
	}
	return c;
}

function estTokens() {
	var c = 0;
	for (var i = 0; i < transcript.length; i++)
		c += contentChars(transcript[i]);
	return Math.ceil(c / 4);
}

function trimTranscript() {
	if (nCtx <= 0) return false;
	var budget = Math.floor(nCtx * 0.95);
	if (estTokens() <= budget) return false;
	var target = Math.floor(nCtx * 0.60);
	var trimmed = false;
	while (transcript.length > 2 && estTokens() > target) {
		transcript.shift();
		trimmed = true;
	}
	if (trimmed) {
		lastServerPromptTokens = 0;
		trimwarn.textContent = "\u24E9";
		console.log("history trimmed to", transcript.length,
			"messages; baseline reset, next turn re-anchors");
	}
	return trimmed;
}

/* ============================================================
   SECTION J4: OUTPUT DISPLAY
   ============================================================ */
function logUser(text) {
	turnMarks.push(output.childNodes.length);
	addSpan("user", text + "\n");
	if (autoScroll) scrollBottom();
}

function appendThought(t) {
	t = t.replace(/\n{2,}/g, "\n");
	if (thoughtTail === "\n" && t.charAt(0) === "\n")
		t = t.slice(1);
	if (t === "") return;
	if (genStartTime === 0)
		genStartTime = performance.now();
	thoughtTail = t.charAt(t.length - 1);
	thoughtChars += t.length;
	pendingThought += t;
	scheduleFlush();
}

function appendAnswer(t) {
	if (t === "") return;
	if (genStartTime === 0)
		genStartTime = performance.now();
	reply += t;
	pendingAnswer += t;
	scheduleFlush();
}

function updateCtxLive() {
	if (nCtx <= 0) return;
	var completionEst = Math.ceil((reply.length + thoughtChars) / 4);
	var est = promptEst + completionEst;
	stCTX.textContent = "¢ " + est + "/" + nCtx;

	var now = performance.now();
	if (tgLastTime === 0) {
		tgLastTime = now;
		tgLastTokens = completionEst;
		return;
	}
	var dt = (now - tgLastTime) / 1000;
	if (dt >= 0.8) {
		var delta = completionEst - tgLastTokens;
		if (delta > 0) {
			var rate = delta / dt;
			stTG.textContent = "tg:" + Math.round(rate);
		}
		tgLastTime = now;
		tgLastTokens = completionEst;
	}
}

function beginReply() {
	reply = "";
	thoughtChars = 0;
	promptEst = 0;
	thoughtSpan = null;
	answerSpan = null;
	thoughtTail = "";
	finishReason = "";
	tgLastTime = 0;
	tgLastTokens = 0;
	genStartTime = 0;
	completionTokens = 0;
	pendingThought = "";
	pendingAnswer  = "";
	thoughtTextNode = null;
	answerTextNode  = null;
}

/* ============================================================
   SECTION J4b: rAF FLUSH — BATCHED DOM WRITES

   WHY THIS EXISTS (the 2025-06 crash):

   A 100k-token paste into the editor, followed by a ~28 kB
   assistant reply, caused Firefox ESR to crash with an OOM in
   the renderer process. The output window visibly degraded
   from per-token updates to "chunks of two paragraphs" just
   before the tab died.

   ROOT CAUSE:

   Every SSE token (llama.cpp emits one token per chunk, 1–4
   chars) triggered this sequence in appendAnswer():

       answerSpan.textContent += t      // O(n) string re-serialize
       scrollBottom()                   // scrollHeight = sync reflow
       updateCtxLive()                  // stCTX.textContent = DOM write

   For a 28 kB reply that is ~10 000 SSE chunks. Each chunk
   forced a full synchronous reflow of the #output div, which
   by then contained 130+ kB of pre-wrap monospace text (the
   100k-token user span + the growing reply). Each reflow
   re-wraps every line. Ten thousand reflows on a 130 kB
   pre-wrap div is catastrophic: the main thread is in layout
   code 99% of the time, the compositor can't paint on
   schedule (hence the visible "chunked" updates as frames
   are coalesced), and the per-chunk text-node allocations
   outpace Gecko's GC. Firefox ESR's more conservative GC
   tuning (fewer aggressive collections, to avoid web jank)
   makes it more susceptible than current Firefox.

   THE FIX:

   Accumulate streamed text in plain JS strings (cheap,
   rope-based in SpiderMonkey) and write to the DOM at most
   once per animation frame via requestAnimationFrame. Ten
   thousand mutations become ~600 (one per 16 ms frame).
   Within each frame, Text.appendData() extends the existing
   text node in place (amortized O(1)) instead of
   textContent += which replaces the entire node's data
   (O(n) copy). The scrollHeight read and the context-counter
   write happen once per frame, not once per token.

   THIS IS NOT A "PERFORMANCE OPTIMIZATION." Without it,
   the renderer process runs out of memory on large replies.
   It is a correctness fix for the streaming path.

   SECOND-ROUND BUG (fixed 2025-06, same day):
   The first version of flushDOM used `span.firstChild` to
   obtain the text node. Setting `span.textContent = ""`
   creates NO child nodes, so `firstChild` was null and
   `appendData` threw. The fix is to explicitly create a
   Text node with document.createTextNode("") and append it
   to the span. See flushDOM below.

   THIRD-ROUND BUG (fixed 2025-06):
   requestAnimationFrame is throttled or paused in hidden
   tabs. A long reply in a background tab could accumulate
   the entire response in pendingAnswer before a single
   flushDOM ran, producing one massive appendData + reflow
   when the tab became visible. A 250 ms setTimeout fallback
   and a visibilitychange listener ensure the buffer is
   drained even when rAF is starved.
   ============================================================ */
function scheduleFlush() {
	if (!rafPending) {
		rafPending = true;
		requestAnimationFrame(flushDOM);
	}
	if (!flushTimer) {
		flushTimer = setTimeout(function () {
			flushTimer = 0;
			if (rafPending) flushDOM();
		}, 250);
	}
}

function flushDOM() {
	rafPending = false;
	if (flushTimer) {
		clearTimeout(flushTimer);
		flushTimer = 0;
	}

	var wrote = false;

	if (pendingThought !== "") {
		if (!thoughtTextNode) {
			thoughtSpan = addSpan("thought", "");
			thoughtTextNode = document.createTextNode("");
			thoughtSpan.appendChild(thoughtTextNode);
		}
		thoughtTextNode.appendData(pendingThought);
		pendingThought = "";
		wrote = true;
	}

	if (pendingAnswer !== "") {
		if (!answerTextNode) {
			answerSpan = addSpan("answer", "");
			answerTextNode = document.createTextNode("");
			answerSpan.appendChild(answerTextNode);
		}
		answerTextNode.appendData(pendingAnswer);
		pendingAnswer = "";
		wrote = true;
	}

	if (wrote) {
		updateCtxLive();
		if (autoScroll) scrollBottom();
	}
}

/* ============================================================
   SECTION J4c: UNDO / CUT — DOM REMOVAL
   ============================================================ */
function removeLastTurns(n) {
	while (n > 0 && turnMarks.length > 0) {
		var startIdx = turnMarks[turnMarks.length - 1];
		while (output.childNodes.length > startIdx)
			output.removeChild(output.lastChild);
		turnMarks.pop();
		n--;
	}
}

/* ============================================================
   SECTION J5: SSE FRAMING
   ============================================================ */
function makeSseSink(onObj) {
	var buf = "";
	return function (chunk) {
		buf += chunk;
		var lines = buf.split(/\r\n|\r|\n/);
		buf = lines.pop();
		for (var i = 0; i < lines.length; i++) {
			var line = lines[i];
			if (!line.startsWith("data:")) continue;
			var payload = line.slice(5).trimStart();
			if (payload === "[DONE]") continue;
			var obj;
			try { obj = JSON.parse(payload); } catch (e) { continue; }
			onObj(obj);
		}
	};
}

/* ============================================================
   SECTION J6: ACTIONS
   ============================================================ */
function stopGen() {
	if (!ctrl) return;
	ctrl.abort();
	setStatus("stopping…");
}

function editorKeydown(ev) {
	if ((ev.ctrlKey || ev.metaKey) && !ev.altKey && !ev.shiftKey
	 && (ev.key === "d" || ev.key === "D" || ev.key === "Enter")) {
		ev.preventDefault();
		generate();
	}
}

function newSession() {
	if (ctrl) { setStatus("busy — stop first"); return; }
	var url = serverURL();
	if (!url) { setStatus("no server url"); return; }

	transcript = [];
	turnMarks = [];
	lastServerPromptTokens = 0;
	beginReply();
	clearPendingImage();
	trimwarn.textContent = "";
	editor.value = "";
	editor.focus();
	output.textContent = "";
	autoScroll = true;
	setStatus("clearing…");

	var eraseUrl = url + "/slots/" + slotId + "?action=erase";
	fetch(eraseUrl, { method: "POST" })
	.then(function (res) {
		if (!res.ok) throw new Error("HTTP " + res.status);
		setStatus("reset/ready · slot " + slotId);
	})
	.catch(function () {
		setStatus("cleared");
	});
}

function undoLast() {
	if (ctrl) { setStatus("busy — stop first"); return; }
	if (transcript.length === 0) { setStatus("nothing to undo"); return; }
	if (turnMarks.length === 0) { setStatus("nothing to undo"); return; }

	var savedText = "";
	var i = transcript.length - 1;
	while (i >= 0 && transcript[i].role === "assistant")
		i--;
	if (i >= 0 && transcript[i].role === "user") {
		var c = transcript[i].content;
		if (typeof c === "string") {
			savedText = c;
		} else if (Array.isArray(c)) {
			var parts = [];
			for (var j = 0; j < c.length; j++) {
				if (c[j].type === "text") parts.push(c[j].text);
			}
			savedText = parts.join("\n");
		}
	}

	if (transcript.length > 0
	 && transcript[transcript.length - 1].role === "assistant")
		transcript.pop();
	if (transcript.length > 0
	 && transcript[transcript.length - 1].role === "user")
		transcript.pop();

	removeLastTurns(1);
	lastServerPromptTokens = 0;

	var url = serverURL();
	if (url) {
		fetch(url + "/slots/" + slotId + "?action=erase",
			{ method: "POST" })
		.then(function () {})
		.catch(function () {});
	}

	editor.value = savedText;
	editor.focus();
	editor.selectionStart = editor.selectionEnd = savedText.length;

	setStatus("undone");
}

/* ============================================================
   SECTION J6a: SAVE — most recent reply as .txt
   ============================================================ */
function saveLastReply() {
	if (reply === "") { setStatus("nothing to save"); return; }

	var blob = new Blob([reply], { type: "text/plain" });
	var url = URL.createObjectURL(blob);
	var a = document.createElement("a");
	a.href = url;
	a.download = "bloppadn_"
		+ model.value.replace(/[^a-zA-Z0-9_-]/g, "_")
		+ "_" + new Date().toISOString().replace(/[:.]/g, "-")
		+ ".txt";
	document.body.appendChild(a);
	a.click();
	document.body.removeChild(a);
	setTimeout(function () { URL.revokeObjectURL(url); }, 1000);

	setStatus("saved reply");
}

/* ============================================================
   SECTION J6b: FILE UPLOAD (image + text)

   IMAGE: 15 MB limit.
   TEXT:  2 MB limit.
   ============================================================ */

function detectFileType(file) {
	var name = file.name.toLowerCase();
	var dot = name.lastIndexOf(".");
	if (dot < 0) return "unknown";
	var ext = name.slice(dot);

	var imgExts = [".png", ".jpg", ".jpeg", ".gif", ".webp",
	               ".bmp", ".tiff", ".tif", ".ico"];
	var txtExts = [".txt", ".md", ".py", ".js", ".ts", ".c",
	               ".cpp", ".h", ".hpp", ".java", ".rb", ".sh",
	               ".yml", ".yaml", ".json", ".toml", ".ini",
	               ".log", ".tex", ".sql", ".csv", ".xml",
	               ".html", ".css", ".swift", ".kt", ".scala",
	               ".pl", ".lua", ".php", ".m", ".mm", ".cs",
	               ".vb", ".r", ".jl", ".zig", ".ex", ".exs",
	               ".erl", ".hrl", ".dart", ".groovy", ".gradle",
	               ".cmake", ".make", ".conf", ".cfg", ".env",
	               ".dockerfile", ".properties", ".proto", ".thrift"];

	var i;
	for (i = 0; i < imgExts.length; i++)
		if (ext === imgExts[i]) return "image";
	for (i = 0; i < txtExts.length; i++)
		if (ext === txtExts[i]) return "text";

	return "unknown";
}

function openFilePicker() {
	if (ctrl) { setStatus("busy — stop first"); return; }
	imgfile.value = "";
	imgfile.click();
}

function onFilePicked(ev) {
	var file = ev.target.files && ev.target.files[0];
	if (!file) return;

	var type = detectFileType(file);

	var maxBytes = (type === "image")
		? 15 * 1024 * 1024
		: 2 * 1024 * 1024;

	if (file.size > maxBytes) {
		setStatus("file: >" + (maxBytes / 1024 / 1024) + " MB");
		return;
	}

	if (type === "image") {
		var reader = new FileReader();
		reader.onload = function (e) {
			var img = new Image();
			img.onload = function () {
				var maxDim = 768;
				var w = img.width, h = img.height;
				if (w > maxDim || h > maxDim) {
					var scale = maxDim / Math.max(w, h);
					w = Math.round(w * scale);
					h = Math.round(h * scale);
				}
				var canvas = document.createElement("canvas");
				canvas.width = w;
				canvas.height = h;
				var ctx = canvas.getContext("2d");
				ctx.drawImage(img, 0, 0, w, h);
				var dataUrl = canvas.toDataURL("image/png");

				pendingImage = { dataUrl: dataUrl, name: file.name };
				showImageStrip();
				setStatus("img: " + file.name);
			};
			img.src = e.target.result;
		};
		reader.readAsDataURL(file);

	} else if (type === "text") {
		var reader = new FileReader();
		reader.onload = function (e) {
			var text = e.target.result;

			if (text.indexOf("\u0000") !== -1) {
				setStatus("binary file — not supported");
				return;
			}

			var wrapper = "\n```" + file.name + "\n"
				+ text + "\n```\n";
			editor.value += wrapper;
			editor.selectionStart = editor.selectionEnd
				= editor.value.length;
			setStatus("appended: " + file.name
				+ " (" + text.length + " chars)");
		};
		reader.readAsText(file);
	} else {
		setStatus("unknown file type");
	}
}

function showImageStrip() {
	if (!pendingImage) return;
	imgthumb.src = pendingImage.dataUrl;
	imgname.textContent = pendingImage.name;
	imgstrip.style.display = "flex";
}

function clearPendingImage() {
	pendingImage = null;
	imgstrip.style.display = "none";
	imgthumb.src = "";
	imgname.textContent = "";
}

/* ============================================================
   SECTION J7: MODEL PROBING
   ============================================================ */
function probeSlot(url) {
	return fetch(url + "/slots")
	.then(function (res) {
		if (!res.ok) throw new Error("HTTP " + res.status);
		return res.json();
	})
	.then(function (slots) {
		if (Array.isArray(slots) && slots.length > 0) {
			var idle = null;
			for (var i = 0; i < slots.length; i++) {
				if (slots[i].state === 0) { idle = slots[i]; break; }
			}
			slotId = (idle || slots[0]).id;
		} else {
			slotId = 0;
		}
	})
	.catch(function () {
		slotId = 0;
	});
}

function probeModel(url) {
	return fetch(url + "/props")
	.then(function (res) {
		if (!res.ok) throw new Error("server said " + res.status);
		return res.json();
	})
	.then(function (p) {
		var path = p.model_path || "";
		model.value = path.split("/").pop() || "(unknown model)";
		var dgs = p.default_generation_settings || {};
		nCtx = dgs.n_ctx || 0;
		if (transcript.length === 0 && !ctrl) {
			lastServerPromptTokens = 0;
			turnMarks = [];
			stCTX.textContent = "¢ 0" + (nCtx > 0 ? "/" + nCtx : "");
		}
		return probeSlot(url);
	})
	.then(function () {
		if (!ctrl) {
			setStatus("ready · slot " + slotId);
		}
	})
	.catch(function (err) {
		nCtx = 0;
		model.value = "(no server)";
		if (!ctrl) setStatus("error: " + err.message);
	});
}

/* ============================================================
   SECTION J8: GENERATE
   ============================================================ */
function generate() {
	if (ctrl) { setStatus("busy"); return; }
	var userText = editor.value;
	if (userText.trim() === "" && !pendingImage) {
		setStatus("empty prompt"); return;
	}
	var url = serverURL();
	if (!url) { setStatus("no server url"); return; }

	var userContent;
	if (pendingImage) {
		userContent = [
			{ type: "text", text: userText.trim() || "" },
			{ type: "image_url", image_url: { url: pendingImage.dataUrl } }
		];
	} else {
		userContent = userText;
	}

	var displayText = userText;
	if (pendingImage)
		displayText += " [image: " + pendingImage.name + "]";
	logUser(displayText);

	transcript.push({ role: "user", content: userContent });
	clearPendingImage();
	editor.value = "";
	beginReply();

	trimTranscript();
	promptEst = estTokens();

	var myCtrl = new AbortController();
	ctrl = myCtrl;
	setStatus("generating");
	stPP.textContent = "pp: …";

	var body = {
		messages: transcript,
		stream: true,
		stream_options: { include_usage: true },
		temperature: num("temp", 1.0),
		top_p: num("top_p", 0.95),
		repeat_penalty: num("rp", 1.0)
	};
	body.slot_id = slotId;

	var np = parseInt($("n_predict").value, 10);
	if (np > 0) body.max_tokens = np;

	fetch(url + "/v1/chat/completions", {
		method: "POST",
		headers: { "Content-Type": "application/json" },
		signal: myCtrl.signal,
		body: JSON.stringify(body)
	}).then(function (res) {
		if (!res.ok) throw new Error("server said " + res.status);
		return new Promise(function (resolve, reject) {
			var reader = res.body.getReader();
			var dec = new TextDecoder();
			var sink = makeSseSink(function (o) {
				var ch = o.choices && o.choices[0];
				if (ch && ch.delta) {
					if (typeof ch.delta.reasoning_content === "string")
						appendThought(ch.delta.reasoning_content);
					if (typeof ch.delta.content === "string")
						appendAnswer(ch.delta.content);
					if (ch.finish_reason)
						finishReason = ch.finish_reason;
				}
				if (o.timings) {
					var pp = (o.timings.prompt_ms > 0)
						? o.timings.prompt_n / (o.timings.prompt_ms / 1000)
						: 0;
					var tg = (o.timings.predicted_ms > 0)
						? o.timings.predicted_n / (o.timings.predicted_ms / 1000)
						: 0;
					showStats(pp, tg);
				}
				if (o.usage) {
					lastServerPromptTokens = o.usage.prompt_tokens;
					completionTokens = o.usage.completion_tokens || 0;
					stCTX.textContent = "¢ " + o.usage.total_tokens
						+ (nCtx > 0 ? "/" + nCtx : "");
				}
			});
			(function pump() {
				reader.read().then(function (r) {
					if (r.done) { resolve(); return; }
					sink(dec.decode(r.value, { stream: true }));
					pump();
				}).catch(reject);
			})();
		});
	}).then(function () {
		flushDOM();
		if (reply !== "")
			transcript.push({ role: "assistant", content: reply });
		output.appendChild(document.createTextNode("\n"));
		if (autoScroll) scrollBottom();
		showMeanTg();
		if (ctrl === myCtrl)
			setStatus(finishReason === "length" ? "done (limit)" : "done");
	}).catch(function (err) {
		if (err.name === "AbortError") {
			flushDOM();
			if (reply !== "")
				transcript.push({ role: "assistant", content: reply });
			output.appendChild(document.createTextNode("\n"));
			if (autoScroll) scrollBottom();
			lastServerPromptTokens = 0;
			showMeanTg();
			if (ctrl === myCtrl) setStatus("stopped");
		} else {
			flushDOM();
			if (reply !== "") {
				transcript.push({ role: "assistant", content: reply });
				output.appendChild(document.createTextNode("\n"));
				if (autoScroll) scrollBottom();
			} else {
				if (transcript.length > 0
				 && transcript[transcript.length - 1].role === "user") {
					transcript.pop();
					removeLastTurns(1);
					editor.value = userText;
					editor.focus();
				}
			}
			if (ctrl === myCtrl) setStatus("error: " + err.message);
			console.error(err);
		}
	}).then(function () {
		if (ctrl === myCtrl) ctrl = null;
	});
}

/* ============================================================
   SECTION J9: MAIN
   ============================================================ */
function main() {
	editor   = $("editor");
	output   = $("output");
	statusEl = $("status");
	statustext = $("statustext");
	trimwarn = $("trimwarn");
	server   = $("server");
	model    = $("model");
	send     = $("send");
	stopbtn  = $("stopbtn");
	newbtn   = $("newbtn");
	stPP     = $("st_pp");
	stTG     = $("st_tg");
	stCTX    = $("st_ctx");

	imgstrip = $("imgstrip");
	imgthumb = $("imgthumb");
	imgname  = $("imgname");
	imgclear = $("imgclear");
	imgfile  = $("imgfile");

	send.onclick    = generate;
	stopbtn.onclick = stopGen;
	newbtn.onclick  = newSession;
	$("btn4").onclick = undoLast;
	$("btn5").onclick = saveLastReply;
	$("btn6").onclick = openFilePicker;
	imgfile.addEventListener("change", onFilePicked);
	imgclear.addEventListener("click", clearPendingImage);
	editor.addEventListener("keydown", editorKeydown);

	output.addEventListener("scroll", function () {
		autoScroll = output.scrollHeight - output.scrollTop
			- output.clientHeight < 40;
	});

	document.addEventListener("visibilitychange", function () {
		if (!document.hidden && rafPending) flushDOM();
	});

	probeModel(serverURL());
	editor.focus();
	setStatus("ready");
}
main();
